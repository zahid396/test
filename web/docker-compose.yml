services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: live-test-production
    ports:
      - "${PORT:-8080}:8080"
    environment:
      APP_ENV: local
      APP_DEBUG: true
      APP_KEY: "${APP_KEY:-}"
      APP_URL: http://localhost:${PORT:-8080}
      DB_CONNECTION: sqlite
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      CACHE_STORE: database
      LOG_CHANNEL: stack
    volumes:
      - sqlite-data:/var/www/html/database

volumes:
  sqlite-data: